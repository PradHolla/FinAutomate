<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login-like fixture</title>
</head>
<body>
  <nav>
    <a href="openaccount.htm">Open New Account</a>
  </nav>

  <form>
    <p><b>Username</b></p>
    <div class="login"><input type="text" name="username" /></div>

    <p><b>Password</b></p>
    <div class="login"><input type="password" name="password" /></div>

    <input type="submit" class="button" value="Log In" />

    <p><b>What type of Account would you like to open?</b></p>
    <select id="type" class="input">
      <option value="0">CHECKING</option>
      <option value="1">SAVINGS</option>
    </select>

    <input type="submit" class="button" value="Open New Account" />

    <input type="hidden" name="csrf" value="deadbeef" />
    <div style="display:none">This is not shown</div>
  </form>

  <!-- The shapes a value lives in when it is not a form control: a result cell
       with a stable id, a wrapper whose only job is to hold one, and a layout
       container that also holds real controls. -->
  <div id="resultPanel">
    <table>
      <tr><td><b>Status:</b></td><td id="loanStatus">Denied</td></tr>
    </table>
    <div id="refusalReason"><p class="error">Your available funds are too low.</p></div>
    <div id="hasAControl">Pick one <button>Retry</button></div>
  </div>
</body>
</html>
